<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143323">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("kk-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <title>Your cart | Kheti Kranti</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#193526;background:#f3f7f3;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px max(22px,calc((100% - 1080px)/2));background:#fff;border-bottom:1px solid #e0e9e1}
    .brand{display:flex;align-items:center;gap:8px;font-weight:800;color:#176b38;text-decoration:none;font-size:1.15rem}
    .brand .logo-image{display:block;width:54px;height:54px;flex:none;object-fit:contain}
    .brand .logo-image[hidden]{display:none}
    nav{display:flex;gap:10px;flex-wrap:wrap}
    nav a,.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 15px;border:1px solid #cddccf;border-radius:10px;background:#fff;color:#193526;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}
    nav a:hover,.button:hover{border-color:#176b38}
    main{width:min(920px,calc(100% - 32px));margin:34px auto}
    .panel{padding:clamp(20px,4vw,34px);border:1px solid #e0e9e1;border-radius:18px;background:#fff;box-shadow:0 12px 34px #1935260c}
    h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2rem)}
    .subtle{margin:0;color:#66766b}
    #cartItems{display:grid;gap:14px;margin:26px 0}
    .cart-line{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:18px;padding:14px;border:1px solid #e4ebe5;border-radius:14px}
    .cart-line img,.placeholder{width:100px;height:84px;border-radius:10px;object-fit:cover;background:#edf4ed}
    .placeholder{display:grid;place-items:center;font-size:2rem}
    .cart-line h2{margin:0 0 6px;font-size:1.08rem}
    .muted{color:#66766b;font-size:.9rem}
    .duration{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:.9rem}
    input[type=number],input[type=text]{min-height:40px;width:90px;padding:8px;border:1px solid #cddccf;border-radius:8px;font:inherit}
    .cart-line select{min-height:38px;padding:7px 9px;border:1px solid #cddccf;border-radius:8px;background:#fff;font:inherit}
    .qty{display:flex;align-items:center;gap:8px}
    .qty button{width:36px;height:36px;border:1px solid #cddccf;border-radius:9px;background:#fff;font-size:1.1rem;cursor:pointer}
    .remove{margin-top:8px;padding:0;border:0;background:none;color:#a32219;font:inherit;cursor:pointer}
    .summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:18px;border-top:1px solid #e4ebe5}
    .payment-choice{display:grid;gap:6px;min-width:190px;font-weight:700}
    .payment-choice select{min-height:42px;padding:8px;border:1px solid #cddccf;border-radius:8px;background:#fff;font:inherit}
    .delivery-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:24px 0;padding:18px;border:1px solid #e4ebe5;border-radius:14px}
    .delivery-form h2,.delivery-form .form-intro{grid-column:1/-1;margin:0}
    .delivery-form label{display:grid;gap:6px;font-weight:700}
    .delivery-form input,.delivery-form textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid #cddccf;border-radius:8px;background:#fff;color:inherit;font:inherit}
    .delivery-form textarea{min-height:76px;resize:vertical}
    .delivery-form .full-width{grid-column:1/-1}
    #summary[hidden]{display:none}
    .total{font-size:1.2rem;font-weight:800}
    .primary{border:0;background:#176b38;color:#fff}
    .primary:hover{background:#0f572b}
    button:disabled{opacity:.55;cursor:not-allowed}
    #message{min-height:24px;margin:16px 0 0;color:#a32219}
    #message.success{color:#176b38}
    .empty{padding:28px;text-align:center;border:1px dashed #cddccf;border-radius:14px;color:#66766b}
    .receipt{margin-top:22px;padding:18px;border-radius:14px;background:#eff8f0}
    .receipt h2{margin:0 0 10px}
    .receipt li{margin:8px 0}
    :root[data-theme="dark"]{color-scheme:dark;color:#e8f0e9;background:#101b15}
    :root[data-theme="dark"] body{background:#101b15;color:#e8f0e9}
    :root[data-theme="dark"] header{border-color:#365743;background:#143323}
    :root[data-theme="dark"] .brand{color:#f0b83d}
    :root[data-theme="dark"] nav a,:root[data-theme="dark"] .button{border-color:#45614d;background:#1b2c22;color:#e8f0e9}
    :root[data-theme="dark"] .panel,:root[data-theme="dark"] .cart-line{border-color:#365743;background:#1b3f2b;color:#e8f0e9}
    :root[data-theme="dark"] .subtle,:root[data-theme="dark"] .muted{color:#b1c0b5}
    :root[data-theme="dark"] input,:root[data-theme="dark"] select{border-color:#45614d;background:#102017;color:#e8f0e9}
    :root[data-theme="dark"] .delivery-form{border-color:#365743}
    :root[data-theme="dark"] .delivery-form input,:root[data-theme="dark"] .delivery-form textarea{border-color:#45614d;background:#102017;color:#e8f0e9}
    :root[data-theme="dark"] .receipt{background:#1b3f2b;color:#e8f0e9}
    :root[data-theme="dark"] .empty{border-color:#45614d;color:#b1c0b5}
    @media(max-width:640px){header{align-items:flex-start;flex-direction:column}.cart-line{grid-template-columns:72px 1fr;gap:12px}.cart-line img,.placeholder{width:72px;height:72px}.qty{grid-column:2}.summary{align-items:stretch;flex-direction:column}.summary .button{width:100%}.delivery-form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <a class="brand site-brand" href="/en-index.html" id="brand"><span id="brandName">Kheti Kranti</span></a>
    <nav>
      <a href="/en-index.html" id="homeLink">Continue shopping</a>
      <a href="/track" id="trackLink">Track an order</a>
    </nav>
  </header>
  <main>
    <section class="panel">
      <h1 id="title">Your cart</h1>
      <p class="subtle" id="intro">Review items, change rental duration or remove anything you no longer need.</p>
      <div id="cartItems" aria-live="polite"></div>
      <form class="delivery-form" id="deliveryForm">
        <h2 id="deliveryTitle">Delivery details</h2>
        <p class="subtle form-intro" id="deliveryIntro">Enter the recipient and complete address for delivery.</p>
        <label><span id="recipientNameLabel">Recipient name</span><input name="recipientName" type="text" autocomplete="name" maxlength="100" required></label>
        <label><span id="recipientPhoneLabel">Phone number</span><input name="recipientPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" required></label>
        <label class="full-width"><span id="addressLabel">House, street and area</span><textarea name="address" autocomplete="street-address" maxlength="300" required></textarea></label>
        <label><span id="cityLabel">Village / city</span><input name="city" type="text" autocomplete="address-level2" maxlength="100" required></label>
        <label><span id="stateLabel">State</span><input name="state" type="text" autocomplete="address-level1" maxlength="100" required></label>
        <label><span id="postalCodeLabel">PIN code</span><input name="postalCode" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="6" pattern="[0-9]{6}" required></label>
        <label><span id="landmarkLabel">Landmark (optional)</span><input name="landmark" type="text" maxlength="150"></label>
        <label class="full-width"><span id="instructionsLabel">Delivery instructions (optional)</span><textarea name="instructions" maxlength="500"></textarea></label>
      </form>
      <div class="summary" id="summary" hidden>
        <strong class="total" id="total"></strong>
        <label class="payment-choice" id="paymentChoiceLabel" for="paymentMethod">
          <span id="paymentChoiceText">Payment method</span>
          <select id="paymentMethod">
            <option value="online">Online payment</option>
            <option value="cash">Cash on delivery</option>
          </select>
        </label>
        <button class="button primary" id="checkout" type="button">Continue to secure payment</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="receipt" class="receipt" hidden></section>
    </section>
  </main>
  <script src="/brand-logo.js" defer></script>
  <script src="/cart.js" defer></script>
</body>
</html>
